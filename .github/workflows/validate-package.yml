name: Validate and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Test packaging safeguards
        run: python3 -m unittest discover -s tests -v
      - name: Build install ZIP and provenance
        run: python3 tools/package.py --output-dir dist --label ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: RCPArsenal-test-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
